# One-time intake: downloads photos Caring for a Cause already published on
# its own websites and YouTube channel, for review. Runs only on this branch.
name: Import public photos

on:
  push:
    branches: [intake/public-photos]
    paths: [.github/workflows/import-public-photos.yml]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Download
        run: |
          set -euo pipefail
          out=photo-intake
          mkdir -p "$out/2021-site" "$out/current-site" "$out/youtube"
          get() { curl -fsSL --retry 3 -A "Mozilla/5.0" -o "$2" "$1" || echo "FAILED $1" >> "$out/failures.txt"; }

          # 2021 Webflow site (Netlify): gallery, program images, original logo
          base="https://caringforacauseindy.netlify.app"
          curl -fsSL -A "Mozilla/5.0" "$base/" -o "$out/2021-site/index.html"
          grep -oE 'https://d33wubrfki0l68\.cloudfront\.net/[^" )]+\.(jpg|jpeg|png|svg|webp)' "$out/2021-site/index.html" | sort -u > "$out/2021-site/urls.txt"
          while read -r url; do get "$url" "$out/2021-site/$(basename "$url")"; done < "$out/2021-site/urls.txt"

          # Current GoDaddy site
          cur="https://caring4acausesupportiveservices.com/"
          curl -fsSL -A "Mozilla/5.0" "$cur" -o "$out/current-site/index.html"
          grep -oE '//img1\.wsimg\.com/isteam/ip/[^" ),]+' "$out/current-site/index.html" \
            | sed -E 's#^//#https://#; s#/:/.*$##' | sort -u > "$out/current-site/urls.txt"
          i=0
          while read -r url; do i=$((i+1)); get "$url" "$out/current-site/$(printf '%02d' $i)-$(basename "$url")"; done < "$out/current-site/urls.txt"

          # YouTube thumbnails for the organization's own videos
          for id in 7smWzJwY9kA Z5USx1xFF58 02gc0dPLET0 xUVUOB-w94Q; do
            get "https://i.ytimg.com/vi/$id/maxresdefault.jpg" "$out/youtube/$id-maxres.jpg"
            get "https://i.ytimg.com/vi/$id/hqdefault.jpg" "$out/youtube/$id-hq.jpg"
          done

          rm -f "$out"/*/index.html
          find "$out" -type f -size 0 -delete
          ls -laR "$out"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898599+github-actions[bot]@users.noreply.github.com"
          git add photo-intake
          git commit -m "Import public photos for review" || echo "nothing to commit"
          git push
