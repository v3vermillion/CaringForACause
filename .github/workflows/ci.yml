name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, types, build, and browser tests (10 devices, 3 engines)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      # The build type-checks and validates dist/ (the same gate Cloudflare runs).
      - run: npm run build
      - run: npm run test:gate
      - run: npx playwright install --with-deps chromium webkit firefox
      - run: npm run test
      # Post failed or flaky tests to a single tracking issue, so problems can be
      # diagnosed without downloading logs or artifacts.
      - name: Report failed or flaky browser tests
        if: always() && hashFiles('playwright-report/results.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "Commit: ${{ github.sha }}"
            echo
            node scripts/summarize-test-failures.mjs playwright-report/results.json
          } > failure-summary.md
          grep -q '^### ' failure-summary.md || { echo "No failed or flaky tests."; exit 0; }
          head -c 60000 failure-summary.md > failure-comment.md
          number=$(gh issue list --state open --label ci-failure --json number --jq '.[0].number')
          if [ -z "$number" ]; then
            gh label create ci-failure --color B60205 --description "Automated CI failure report" --force
            gh issue create --title "CI browser test report" --label ci-failure --body-file failure-comment.md
          else
            gh issue comment "$number" --body-file failure-comment.md
          fi
      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  lighthouse:
    name: Lighthouse budgets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Measures the preview build. Search blocking is intentional, so the budget
      # checks each SEO audit except "is crawlable" (see lighthouserc.json). A
      # launch build can't be measured until every fact is confirmed.
      - run: npm run build
      - run: npx --yes @lhci/cli@0.15.1 autorun
      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: lhci-report/
          retention-days: 14

  # Publishes only after every check above passes. Inactive until the
  # CLOUDFLARE_API_TOKEN secret exists (see README "Deploying").
  deploy:
    name: Deploy to Cloudflare
    needs: [verify, lighthouse]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: preview
      url: ${{ vars.SITE_URL }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
      PUBLIC_ALLOW_INDEXING: ${{ vars.PUBLIC_ALLOW_INDEXING }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - name: Check deploy settings
        id: settings
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy skipped: set the CLOUDFLARE_API_TOKEN secret and CLOUDFLARE_ACCOUNT_ID variable to enable gated deploys."
            exit 0
          fi
          for name in PUBLIC_SITE_URL SITE_URL; do
            if [ -z "${!name}" ]; then echo "::error::Repository variable $name is not set."; exit 1; fi
          done
          echo "enabled=true" >> "$GITHUB_OUTPUT"
      - if: steps.settings.outputs.enabled == 'true'
        uses: actions/checkout@v7
      - if: steps.settings.outputs.enabled == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.settings.outputs.enabled == 'true'
        run: npm ci
      - if: steps.settings.outputs.enabled == 'true'
        run: npm run build
      - if: steps.settings.outputs.enabled == 'true'
        run: npx wrangler deploy
      - name: Confirm the live site serves this commit
        if: steps.settings.outputs.enabled == 'true'
        env:
          EXPECTED_VERSION: ${{ github.sha }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if scripts/check-live-headers.sh "$SITE_URL" > smoke.md; then cat smoke.md; exit 0; fi
            echo "Attempt $attempt failed; retrying in 10 seconds."
            sleep 10
          done
          cat smoke.md
          exit 1
