name: CI

# No run on push to main: every change arrives through a PR that already
# passed this exact code (see docs/DECISIONS.md). Run by hand if needed.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The browser suite runs as five parts side by side, two devices each, instead
# of one long job (decision 65). Every test still runs, on the same devices,
# with the same workers, retry, traces and screenshots. One final job carries
# the name the main ruleset requires and passes only if every part passed.
jobs:
  checks:
    name: Format, types, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      # The build type-checks and validates dist/ (the same gate Cloudflare runs).
      - run: npm run build
      - run: npm run test:gate

  browser-tests:
    name: Browser tests ${{ matrix.shard }}/5 (${{ matrix.devices }})
    runs-on: ubuntu-latest
    # A part takes about 4 to 8 minutes; the limit is a hang stop, not a budget.
    timeout-minutes: 25
    strategy:
      # One part failing never stops the others, so every failure is reported.
      fail-fast: false
      matrix:
        # Playwright's --shard splits the full test list, so every test runs in
        # exactly one part whatever these names say. With 10 devices and one
        # spec file each part is two whole devices; the check below fails if a
        # part ever runs other devices than its name says (a device added or
        # removed means updating these names, and the count to 5 if needed).
        include:
          - shard: 1
            devices: iPhone SE, iPhone 12 mini
            projects: iphone-se iphone-12-mini
          - shard: 2
            devices: iPhone 17, iPhone 17 Pro Max
            projects: iphone-17 iphone-17-pro-max
          - shard: 3
            devices: iPad mini, Galaxy S24
            projects: ipad-mini galaxy-s24
          - shard: 4
            devices: Pixel 7, desktop Safari
            projects: pixel-7 desktop-safari
          - shard: 5
            devices: desktop Firefox, desktop Chrome
            projects: desktop-firefox desktop-chrome
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The same dist/ the build makes; the type check and the build gate run
      # once, in the checks job.
      - run: npx astro build
      # Browsers are ~1 GB and change only with the Playwright version, so they
      # are cached on that version (the same key the live check saves on main)
      # and only downloaded when it changes; the OS packages they need are
      # installed either way.
      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('node_modules/@playwright/test/package.json') }}
      - run: npx playwright install --with-deps chromium webkit firefox
        if: steps.browsers.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium webkit firefox
        if: steps.browsers.outputs.cache-hit == 'true'
      - name: Check this part runs the devices it is named for
        env:
          EXPECTED: ${{ matrix.projects }}
        run: |
          actual=$(npx playwright test --list --shard=${{ matrix.shard }}/5 --reporter=list \
            | sed -n 's/^ *\[\([a-z0-9-]*\)\].*/\1/p' | sort -u | xargs)
          expected=$(printf '%s\n' $EXPECTED | sort -u | xargs)
          echo "Part ${{ matrix.shard }} runs: $actual"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Part ${{ matrix.shard }} runs [$actual] but is named for [$expected]. Update the matrix in ci.yml."
            exit 1
          fi
      - run: npx playwright test --shard=${{ matrix.shard }}/5 --reporter=blob,list
      # The part's results, merged with the others' in the report job.
      - name: Upload this part's results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          if-no-files-found: error
          retention-days: 1
      # Traces and screenshots of any failed test, as before.
      - name: Upload traces and screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  report:
    name: Browser test report
    needs: browser-tests
    # Runs after the parts whether they passed or failed, so failures are posted.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true
      # One report for the whole run: the GitHub annotations, the list, and the
      # JSON the tracking issue is written from.
      - name: Merge the five parts into one report
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-report/results.json
        run: npx playwright merge-reports --reporter=github,list,json ./all-blob-reports
      # Post failed or flaky tests to a single tracking issue, so problems can be
      # diagnosed without downloading logs or artifacts.
      - name: Report failed or flaky browser tests
        # Dependabot pull requests get a read-only token, so they can't post to
        # issues; their failures still show as a failed check on the pull request.
        if: always() && github.actor != 'dependabot[bot]' && hashFiles('playwright-report/results.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "Commit: ${{ github.sha }}"
            echo
            node scripts/summarize-test-failures.mjs playwright-report/results.json
          } > failure-summary.md
          grep -q '^### ' failure-summary.md || { echo "No failed or flaky tests."; exit 0; }
          head -c 60000 failure-summary.md > failure-comment.md
          number=$(gh issue list --state open --label ci-failure --json number --jq '.[0].number')
          if [ -z "$number" ]; then
            gh label create ci-failure --color B60205 --description "Automated CI failure report" --force
            gh issue create --title "CI browser test report" --label ci-failure --body-file failure-comment.md
          else
            gh issue comment "$number" --body-file failure-comment.md
          fi
      # The merge reports success even when tests failed, and a part that never
      # ran leaves nothing to merge, so the count is checked: every listed test
      # must appear in the merged report exactly once.
      - name: Check every test ran
        run: |
          listed=$(npx playwright test --list --reporter=list | sed -n 's/^Total: \([0-9]*\) tests.*/\1/p')
          reported=$(node -e "const s = require('./playwright-report/results.json').stats; console.log(s.expected + s.unexpected + s.flaky + s.skipped)")
          echo "Listed: $listed tests. In the merged report: $reported."
          if [ -z "$listed" ] || [ "$listed" != "$reported" ]; then
            echo "::error::The merged report has $reported tests, but the suite lists $listed. A part did not run or its results are missing."
            exit 1
          fi
      - name: Upload the merged report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # The check the main ruleset requires, under its existing name. It passes
  # only if the checks, every browser-test part and the report all passed; it
  # runs even when one of them failed or was cancelled, because a skipped
  # required check would count as passing.
  required:
    name: Format, types, build, and browser tests (10 devices, 3 engines)
    needs: [checks, browser-tests, report]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every part passed
        env:
          CHECKS: ${{ needs.checks.result }}
          BROWSER_TESTS: ${{ needs.browser-tests.result }}
          REPORT: ${{ needs.report.result }}
        run: |
          echo "Format, types, build: $CHECKS · browser tests: $BROWSER_TESTS · report: $REPORT"
          [ "$CHECKS" = success ] && [ "$BROWSER_TESTS" = success ] && [ "$REPORT" = success ]

  lighthouse:
    name: Lighthouse budgets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Measures the preview build. Search blocking is intentional, so the budget
      # checks each SEO audit except "is crawlable" (see lighthouserc.json). A
      # launch build can't be measured until every fact is confirmed.
      - run: npm run build
      - run: npx --yes @lhci/cli@0.15.1 autorun
      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: lhci-report/
          retention-days: 14
