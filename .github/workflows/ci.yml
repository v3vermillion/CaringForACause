name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, types, build, and browser tests (10 devices, 3 engines)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit firefox
      - run: npm run test
      # Post failed or flaky tests to a single tracking issue, so problems can be
      # diagnosed without downloading logs or artifacts.
      - name: Report failed or flaky browser tests
        if: always() && hashFiles('playwright-report/results.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "Commit: ${{ github.sha }}"
            echo
            node scripts/summarize-test-failures.mjs playwright-report/results.json
          } > failure-summary.md
          grep -q '^### ' failure-summary.md || { echo "No failed or flaky tests."; exit 0; }
          head -c 60000 failure-summary.md > failure-comment.md
          number=$(gh issue list --state open --label ci-failure --json number --jq '.[0].number')
          if [ -z "$number" ]; then
            gh label create ci-failure --color B60205 --description "Automated CI failure report" --force
            gh issue create --title "CI browser test report" --label ci-failure --body-file failure-comment.md
          else
            gh issue comment "$number" --body-file failure-comment.md
          fi
      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  lighthouse:
    name: Lighthouse budgets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Build with indexing on so the SEO audit measures the launch configuration.
      # This build is only measured, never deployed.
      - run: npm run build
        env:
          PUBLIC_ALLOW_INDEXING: "true"
      - run: npx --yes @lhci/cli@0.15.1 autorun
      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: lhci-report/
          retention-days: 14
